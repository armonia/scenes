# Renderizza le scene e pubblica lo showcase.
#
# PERCHE' ESISTE. Il deploy era `wrangler pages deploy` lanciato a mano dalla
# macchina di chi aveva i render sul disco. E' cosi' che la pagina ha mostrato
# per giorni una scena che non esisteva piu': il codice era aggiornato, i .mp4
# no, e nessuno dei due lo sapeva. Qui i video si rifanno dalla sorgente a ogni
# push, quindi la pagina non puo' essere piu' vecchia del codice.
#
# I RENDER NON SONO IN GIT, ed e' il motivo per cui questo workflow renderizza
# invece di limitarsi a copiare. Sono file grossi e rigenerabili: tenerli nel
# repo li farebbe divergere in silenzio esattamente come e' successo.
#
# I BANCHI GIRANO PRIMA DEL DEPLOY, non dopo. Un sito pubblicato e poi trovato
# rotto e' gia' stato visto da qualcuno.
#
# RIFARE I VIDEO E' L'UNICA COSA CHE COSTA (sette minuti per rapporto) e
# quasi ogni push non la richiede: correggere una riga della pagina o del README
# non cambia un pixel dei render, che escono identici a quelli di prima. Quindi
# i render passano da una cache la cui chiave e' il contenuto di tutto cio' che
# puo' cambiarli o giudicarli: le sorgenti delle scene, le dipendenze, e anche i
# banchi. Chiave presa = quei video esatti hanno gia' passato quei banchi
# esatti, e rifarli non direbbe niente di nuovo; si va dritti al deploy.
# Chiave diversa = giro intero, senza scorciatoie.
#
# LA CACHE SI SCRIVE SOLO A BANCHI PASSATI, con un save esplicito in fondo e non
# con il salvataggio automatico di actions/cache. Altrimenti un render bocciato
# finirebbe in cache, e la run dopo salterebbe i controlli che l'avevano
# bocciato e lo pubblicherebbe.

#
# TRE JOB E NON UNO, e il motivo e' un conto. La run di main del 15 settembre 2026
# durava 21 minuti in un job solo: render 7, misure 5, negativi 4, pagina 4. Con
# i tre rapporti sarebbero stati piu' di cinquanta. Adesso:
#   - `pagina` controlla le dimostrazioni e la proiezione, che non leggono i
#     render, e parte subito;
#   - `formato` gira tre volte in parallelo, una per rapporto: renderizza le
#     scene e i provini del tempo di quel rapporto, esegue i controlli generati
#     dal manifest (scripts/checks/*.mjs, eseguiti da expect.sh) e verifica che
#     ogni banco abbia un negativo che fallisce (bench-coverage.py);
#   - `deploy` aspetta tutti e quattro, assembla la pagina coi render del 16:9 e
#     pubblica. La pagina resta sul 16:9: i verticali sono negli artefatti.
# Ogni rapporto ha la sua cache: un push che tocca solo la pagina non
# ri-renderizza niente.

name: render e deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: showcase
  cancel-in-progress: true

jobs:
  pagina:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node 22 per il manifest (i casi della proiezione leggono i moduli .ts del
      # kit e di Topics), senza dipendenze: quei moduli non importano Remotion.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pillow serve a loop-close.py per decodificare gli screenshot: e' l'unico
      # banco che guarda dei pixel del browser invece del DOM.
      - name: il browser dei banchi
        run: |
          python3 -m pip install --quiet --disable-pip-version-check playwright pillow
          python3 -m playwright install --with-deps chromium

      # Le dimostrazioni si misurano sul sorgente della pagina: showcase-build.sh
      # la copia com'e' in showcase/dist, quindi il contenuto e' lo stesso, e questo
      # job non deve aspettare i render per assemblarla.
      - name: le dimostrazioni mostrano ancora la loro tesi?
        run: |
          # La proiezione del kit (kit/project.ts) contro Chromium: due lastre,
          # tre stage, le sei pose della catena, cinque punti ciascuno. E deve
          # accorgersi di un'origine della prospettiva sbagliata nel CSS.
          ./scripts/project-check.py
          rc=0; ./scripts/project-check.py --origin-mismatch --must-fail > /tmp/pc.log 2>&1 || rc=$?
          [ "$rc" = 0 ] || { echo "project-check.py non si accorge dell'origine sbagliata (rc=$rc)" >&2; cat /tmp/pc.log >&2; exit 1; }
          echo "project-check.py boccia l'origine sbagliata, come deve."

          # Nessun banco si calcola da se' la geometria di un prodotto: la chiede
          # al manifest. E il controllo deve bocciare una copia dei banchi in cui
          # uno torna a importare topics/geometry.ts.
          ./scripts/no-product-literals.sh
          mkdir -p /tmp/banchi-guasti && cp scripts/*.sh scripts/*.py scripts/*.mjs /tmp/banchi-guasti/
          printf '%s\n' "read -r X < <(node --input-type=module -e 'const m = await import(\"\$ROOT/video/src/products/topics/geometry.ts\"); console.log(m.THREAD_TOP)')" >> /tmp/banchi-guasti/handoff-travel.sh
          rc=0; ./scripts/no-product-literals.sh /tmp/banchi-guasti > /tmp/npl.log 2>&1 || rc=$?
          [ "$rc" = 1 ] || { echo "no-product-literals.sh promuove un banco che importa topics/geometry.ts (rc=$rc)" >&2; cat /tmp/npl.log >&2; exit 1; }
          echo "no-product-literals.sh boccia un banco che importa topics/geometry.ts, come deve."

          ./scripts/demo-check.py

          # E i cicli si devono chiudere. Le demo girano in loop: se l'ultimo
          # fotogramma non somiglia al primo, ogni giro ha uno stacco secco, e a
          # chi guarda non arriva "questa riparte", arriva "il sito scatta".
          # Dieci voci su trenta lo facevano, su una pagina che spiega perche'
          # gli stacchi non si fanno.
          ./scripts/loop-close.py

          # E il banco deve bocciare il suo caso peggiore: una copia della
          # pagina in cui CHR-03 fa scattare i tre eventi a frame distinti in
          # entrambe le meta', cioe' senza piu' il contrasto che la voce
          # dichiara. Se qui passasse, il verde qui sopra vorrebbe dire solo
          # che lo script e' arrivato in fondo.
          sed 's/var fn=second?30:35, fp=second?30:41;/var fn=35, fp=41;/' \
            showcase/grammatica.html > /tmp/guasta.html
          if cmp -s showcase/grammatica.html /tmp/guasta.html; then
            echo "la copia guasta e' identica all'originale: la sed non ha trovato niente." >&2
            exit 1
          fi
          rc=0; ./scripts/demo-check.py /tmp/guasta.html > /tmp/guasta.log 2>&1 || rc=$?
          if [ "$rc" = 0 ]; then
            echo "demo-check.py promuove una pagina in cui CHR-03 non dimostra piu' niente." >&2
            cat /tmp/guasta.log >&2; exit 1
          fi
          grep -q 'ROTTA CHR-03' /tmp/guasta.log || {
            echo "demo-check.py boccia la copia guasta ma non nomina CHR-03:" >&2
            cat /tmp/guasta.log >&2; exit 1; }
          echo "demo-check.py boccia la copia guasta e dice quale voce, come deve."

          # E lo stesso sul lato tipografico, che ha un palco diverso e quindi
          # una sonda diversa: qui si rendono uguali le due soste di TYP-01, cioe'
          # si toglie il contrasto sul quale la voce si regge.
          sed 's/var DW = {A:56, B:35, R:22};/var DW = {A:56, B:56, R:22};/' \
            showcase/grammatica.html > /tmp/guasta-typ.html
          if cmp -s showcase/grammatica.html /tmp/guasta-typ.html; then
            echo "la copia guasta tipografica e' identica all'originale: la sed non ha trovato niente." >&2
            exit 1
          fi
          rc=0; ./scripts/demo-check.py /tmp/guasta-typ.html > /tmp/gt.log 2>&1 || rc=$?
          [ "$rc" != 0 ] || { echo "demo-check.py promuove una pagina in cui le due soste di TYP-01 sono uguali." >&2; cat /tmp/gt.log >&2; exit 1; }
          grep -q 'ROTTA TYP-01' /tmp/gt.log || {
            echo "demo-check.py boccia la copia guasta tipografica ma non nomina TYP-01:" >&2
            cat /tmp/gt.log >&2; exit 1; }
          echo "demo-check.py boccia anche una voce tipografica senza contrasto."

          # loop-close.py deve bocciare un ciclo che non si chiude: si rimette
          # CAM-01 a senso unico, cioe' com'era prima di avere la gamba di
          # rientro, e il banco deve accorgersene e nominarla.
          sed 's/var t=trip(f,170,108,26), p=mix(START,END,t)/var t=E.inout(cl((f-6)\/108)), p=mix(START,END,t)/' \
            showcase/grammatica.html > /tmp/guasta-loop.html
          if cmp -s showcase/grammatica.html /tmp/guasta-loop.html; then
            echo "la copia guasta del ciclo e' identica all'originale: la sed non ha trovato niente." >&2
            exit 1
          fi
          rc=0; ./scripts/loop-close.py /tmp/guasta-loop.html > /tmp/gl.log 2>&1 || rc=$?
          [ "$rc" != 0 ] || { echo "loop-close.py promuove una demo a senso unico." >&2; cat /tmp/gl.log >&2; exit 1; }
          grep -q 'CAM-01' /tmp/gl.log || {
            echo "loop-close.py boccia la copia guasta ma non nomina CAM-01:" >&2
            cat /tmp/gl.log >&2; exit 1; }
          echo "loop-close.py boccia un ciclo che non si chiude, come deve."

          # E deve bocciare anche uno stacco IN MEZZO al ciclo: si rimette CHR-02
          # a ripartire dal vuoto nella seconda meta', cioe' com'era prima
          # dell'orologio virtuale. E' il difetto che si vedeva scorrendo il sito.
          sed 's/var second=f>=125, q=vtime(second?f-125:f,125,86,14);/var second=f>=125, q=second?f-125:f;/' \
            showcase/grammatica.html > /tmp/guasta-mezzo.html
          if cmp -s showcase/grammatica.html /tmp/guasta-mezzo.html; then
            echo "la copia guasta di mezzo e' identica all'originale: la sed non ha trovato niente." >&2
            exit 1
          fi
          rc=0; ./scripts/loop-close.py /tmp/guasta-mezzo.html > /tmp/gm.log 2>&1 || rc=$?
          [ "$rc" != 0 ] || { echo "loop-close.py promuove una meta' che riparte da capo." >&2; cat /tmp/gm.log >&2; exit 1; }
          grep -q 'CHR-02' /tmp/gm.log || {
            echo "loop-close.py boccia la copia guasta ma non nomina CHR-02:" >&2
            cat /tmp/gm.log >&2; exit 1; }
          echo "loop-close.py boccia anche uno stacco in mezzo al ciclo."

          # E la tipografia si deve poter leggere mentre gira: niente parole una
          # sopra l'altra o sotto la HUD, niente fuori quadro, sempre una parola
          # intera sullo schermo, niente che scatti mentre si vede. Due larghezze
          # perche' sul telefono la riga va a capo e la HUD, che e' in pixel,
          # occupa un sesto del palco: due dei difetti trovati c'erano solo li'.
          ./scripts/type-check.py --widths 390,1440

          # Cinque copie guaste, una per regola, e il banco deve bocciarle tutte
          # nominando la voce e il motivo. Ognuna rimette un difetto che la
          # pagina ha avuto davvero.
          guasta_tipo() { # nome, sed, voce, larghezza, motivo atteso
            sed "$2" showcase/grammatica.html > "/tmp/guasta-$1.html"
            if cmp -s showcase/grammatica.html "/tmp/guasta-$1.html"; then
              echo "la copia guasta $1 e' identica all'originale: la sed non ha trovato niente." >&2
              exit 1
            fi
            rc=0; ./scripts/type-check.py "/tmp/guasta-$1.html" --only "$3" --widths "$4" > "/tmp/guasta-$1.log" 2>&1 || rc=$?
            [ "$rc" != 0 ] || { echo "type-check.py promuove la copia guasta $1." >&2; cat "/tmp/guasta-$1.log" >&2; exit 1; }
            grep "ROTTA $3" "/tmp/guasta-$1.log" | grep -q "$5" || {
              echo "type-check.py boccia la copia guasta $1 ma non per $5 su $3:" >&2
              cat "/tmp/guasta-$1.log" >&2; exit 1; }
            echo "type-check.py boccia $3 per $5, come deve."
          }
          # la parola chiave che cresce dal centro copre la riga sotto
          guasta_tipo copertura 's/display:inline-block;transform-origin:50% 100%/display:inline-block;transform-origin:50% 50%/' TYP-02 1440 copertura
          # la frase che sparisce mentre prende peso
          guasta_tipo vuoto 's/T.line.style.fontWeight=String(val);/T.line.style.fontWeight=String(val); T.line.style.opacity=String(1-w);/' TYP-08 1440 'senza una parola intera'
          # il colore acceso in un fotogramma
          guasta_tipo scatto 's/mixc(TNEU,TINT\[0\],a)/mixc(TNEU,TINT[0],a>0.5?1:0)/' TYP-03 1440 scatti
          # la didascalia stesa sopra il contatore, sul telefono
          guasta_tipo hud 's/bottom: max(4cqw, 34px);/bottom: 4cqw;/' TYP-09 390 'sotto la HUD'
          # col movimento ridotto, il fotogramma fermo a meta' di una dissolvenza
          guasta_tipo fermo 's/M.mask={dur:MK.D, half:MK.F1, still:60, kind:"type",/M.mask={dur:MK.D, half:MK.F1, still:114, kind:"type",/' TYP-05 1440 'movimento ridotto'

  formato:
    runs-on: ubuntu-latest
    # Il limite che il piano chiede per job. La misura locale sta nel README.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ratio: ["16x9", "9x16", "4x5"]

    steps:
      - uses: actions/checkout@v4

      # LA CHIAVE CONTIENE IL RAPPORTO: tre job con la stessa chiave si
      # scriverebbero a vicenda cartelle video/out diverse.
      - name: chiave dei render
        id: key
        run: |
          echo "value=renders-verificati-${{ matrix.ratio }}-${{ hashFiles('video/src/**', 'video/package-lock.json', 'video/remotion.config.ts', 'video/tsconfig.json', 'video/eslint.config.mjs', 'scripts/**') }}" >> "$GITHUB_OUTPUT"

      - name: render gia' verificati?
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: video/out
          key: ${{ steps.key.outputs.value }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      # ImageMagick, ffmpeg e tesseract servono ai banchi, non al render.
      # Chromium se lo porta Remotion.
      - name: strumenti di misura
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick ffmpeg tesseract-ocr

      - name: dipendenze
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: video
        run: npm ci

      # Il typecheck non dipende dal rapporto: basta farlo una volta.
      - name: typecheck e lint
        if: steps.cache.outputs.cache-hit != 'true' && matrix.ratio == '16x9'
        working-directory: video
        run: npm run lint

      # L'elenco non e' scritto qui: le scene escono da catalog.json, i provini del
      # tempo dalla sua voce tempoFixtures. I comandi si scrivono in un file e si
      # eseguono con lo stdin chiuso invece di finire in `| sh`: con il pipe, il
      # primo comando che legge lo stdin si mangia le righe successive (run
      # 33404856145, "cripts/seam.sh: not found").
      - name: render
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: video
        run: |
          node ../scripts/catalog.mjs render --ratio ${{ matrix.ratio }} > /tmp/render.sh
          sh -e /tmp/render.sh < /dev/null
          ../scripts/fixture-tempo.sh --ratio ${{ matrix.ratio }}

      # I BANCHI E I LORO NEGATIVI, GENERATI. Stavano scritti qui a mano, novanta
      # righe per il solo 16:9: un negativo dimenticato non rompeva niente, e il
      # banco restava verde anche quando non poteva piu' fallire. Adesso ogni banco
      # dichiara i suoi controlli in scripts/checks/, il manifest li calcola per il
      # rapporto, expect.sh li esegue tutti senza fermarsi al primo errore, e
      # bench-coverage.py boccia un banco che promuove senza un caso che boccia.
      - name: i banchi, e i casi che devono bocciare
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          node scripts/manifest.mjs checks --ratio ${{ matrix.ratio }} > /tmp/checks.tsv
          ./scripts/expect.sh /tmp/checks.tsv video/out/bench-report-${{ matrix.ratio }}.json
          ./scripts/bench-coverage.py video/out/bench-report-${{ matrix.ratio }}.json

          # E il controllo della copertura deve accorgersi di un banco senza
          # negativo: si toglie dal report quello di seam e deve uscire 1.
          rc=0; ./scripts/bench-coverage.py video/out/bench-report-${{ matrix.ratio }}.json --without seam > /tmp/cov.log 2>&1 || rc=$?
          [ "$rc" = 1 ] || { echo "bench-coverage.py promuove un report senza il negativo di seam (rc=$rc)" >&2; cat /tmp/cov.log >&2; exit 1; }
          grep -q 'seam' /tmp/cov.log || { echo "bench-coverage.py boccia ma non nomina seam" >&2; cat /tmp/cov.log >&2; exit 1; }
          echo "bench-coverage.py boccia un report senza il negativo di seam, come deve."

      # Da qui in poi i video sono buoni: o li ha appena fatti e misurati questa
      # run, o vengono da una che li aveva gia' misurati. Solo adesso si salvano.
      - name: salva i render verificati
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: video/out
          key: ${{ steps.key.outputs.value }}

      # I render restano scaricabili dalla run anche quando il deploy non parte,
      # cosi' su una PR si guarda il video invece di fidarsi del diff. Il job di
      # deploy prende da qui quelli del 16:9. SEMPRE, anche se un banco boccia: la
      # prima run di questo job e' fallita in CI e passava sul Mac, e senza i render
      # della CI da scaricare la differenza si poteva solo indovinare.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-${{ matrix.ratio }}
          path: |
            video/out/*.mp4
            video/out/bench-report-*.json
          retention-days: 7

  deploy:
    needs: [pagina, formato]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: renders-16x9
          path: video/out

      - name: assembla
        run: ./scripts/showcase-build.sh

      # Il deploy e' l'unico passo che ha bisogno di una credenziale, quindi e'
      # l'unico che puo' non essere disponibile. Senza il token il workflow
      # renderizza, misura e carica gli artefatti lo stesso: una CI che si
      # rifiuta di girare finche' non le dai un segreto e' una CI che nessuno
      # accende. Con il token, il deploy parte da solo.
      - name: c'e' il token?
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=deploy saltato::CLOUDFLARE_API_TOKEN non configurato. I render sono negli artefatti della run. Per attivare il deploy automatico: gh secret set CLOUDFLARE_API_TOKEN --repo armonia/scenes"
          fi

      - name: deploy
        if: |
          steps.cf.outputs.ok == 'true' &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Il progetto Pages si chiama ancora 'remotion-scenes': Cloudflare non
          # rinomina i progetti, e il record DNS di scenes.armonia.io punta al
          # suo hostname. Crearne uno nuovo col nome giusto e spostarci il
          # dominio ha mandato il sito in 522 per un quarto d'ora, perche' il
          # CNAME continuava a puntare al vecchio. Il nome interno non si vede
          # da fuori; il sito giu' si.
          command: pages deploy showcase/dist --project-name remotion-scenes --branch main
