# Renderizza le scene e pubblica lo showcase.
#
# PERCHE' ESISTE. Il deploy era `wrangler pages deploy` lanciato a mano dalla
# macchina di chi aveva i render sul disco. E' cosi' che la pagina ha mostrato
# per giorni una scena che non esisteva piu': il codice era aggiornato, i .mp4
# no, e nessuno dei due lo sapeva. Qui i video si rifanno dalla sorgente a ogni
# push, quindi la pagina non puo' essere piu' vecchia del codice.
#
# I RENDER NON SONO IN GIT, ed e' il motivo per cui questo workflow renderizza
# invece di limitarsi a copiare. Sono file grossi e rigenerabili: tenerli nel
# repo li farebbe divergere in silenzio esattamente come e' successo.
#
# I BANCHI GIRANO PRIMA DEL DEPLOY, non dopo. Un sito pubblicato e poi trovato
# rotto e' gia' stato visto da qualcuno.
#
# RIFARE I VIDEO E' L'UNICA COSA CHE COSTA (quattro minuti su quattro scene) e
# quasi ogni push non la richiede: correggere una riga della pagina o del README
# non cambia un pixel dei render, che escono identici a quelli di prima. Quindi
# i render passano da una cache la cui chiave e' il contenuto di tutto cio' che
# puo' cambiarli o giudicarli: le sorgenti delle scene, le dipendenze, e anche i
# banchi. Chiave presa = quei video esatti hanno gia' passato quei banchi
# esatti, e rifarli non direbbe niente di nuovo; si va dritti al deploy.
# Chiave diversa = giro intero, senza scorciatoie.
#
# LA CACHE SI SCRIVE SOLO A BANCHI PASSATI, con un save esplicito in fondo e non
# con il salvataggio automatico di actions/cache. Altrimenti un render bocciato
# finirebbe in cache, e la run dopo salterebbe i controlli che l'avevano
# bocciato e lo pubblicherebbe.

name: render e deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: showcase
  cancel-in-progress: true

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: chiave dei render
        id: key
        run: |
          echo "value=renders-verificati-${{ hashFiles('video/src/**', 'video/package-lock.json', 'video/remotion.config.ts', 'video/tsconfig.json', 'video/eslint.config.mjs', 'scripts/**') }}" >> "$GITHUB_OUTPUT"

      - name: render gia' verificati?
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: video/out
          key: ${{ steps.key.outputs.value }}

      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      # ImageMagick e ffmpeg servono ai banchi di misura, non al render.
      # Chromium se lo porta Remotion.
      - name: strumenti di misura
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick ffmpeg tesseract-ocr

      - name: dipendenze
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: video
        run: npm ci

      - name: typecheck e lint
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: video
        run: npm run lint

      # L'elenco delle scene non e' scritto qui: esce da catalog.json, lo stesso
      # file da cui Root.tsx dichiara le composition e da cui la pagina prende
      # la vetrina. Una scena aggiunta la' viene renderizzata, misurata e
      # pubblicata senza toccare questo workflow.
      # I comandi si scrivono in un file e si eseguono con lo stdin chiuso,
      # invece di finire in `| sh`. Con il pipe, il primo comando che legge lo
      # stdin (imagemagick lo fa) si mangia le righe successive dello script:
      # nella run 33404856145 fill-measure ha inghiottito mezzo comando e la
      # misura dopo e' morta con "cripts/seam.sh: not found".
      - name: render
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: video
        run: |
          node ../scripts/catalog.mjs render > /tmp/render.sh
          sh -e /tmp/render.sh < /dev/null

      # Le misure che possono fallire. Se una scena e' rotta, il deploy non parte.
      #
      # Le generiche (riempimento di ogni scena, giunta di ogni coppia adiacente)
      # arrivano dal catalogo. Le altre sono legate a una scena sola e restano
      # scritte qui: derivarle da un elenco nasconderebbe che esistono.
      - name: misure
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/framelocked-verdict.sh
          node scripts/catalog.mjs measures > /tmp/misure.sh
          sh -e /tmp/misure.sh < /dev/null
          ./scripts/handoff-travel.sh
          ./scripts/focus-sharpness.sh
          ./scripts/rest-point.sh
          ./scripts/click-gap.sh
          ./scripts/beats.sh
          ./scripts/contrast-floor.py

          # IL TEMPO. Le battute interne di una scena sono scritte rispetto a una
          # durata di riferimento e `durationInFrames` le scala tutte, quindi
          # cambiare la velocita' di una clip e' cambiare un numero in
          # catalog.json. E' una promessa che si rompe in silenzio, e non si
          # verifica guardando: due render alla stessa velocita' apparente hanno
          # durate diverse.
          ./scripts/fixture-tempo.sh
          ./scripts/tempo.py

          # E i banchi percettivi devono passare ANCHE sul render ritempificato.
          # E' il vero controllo di regressione del tempo: se accorciando la
          # scena il clic si scollasse dalla sua conseguenza, o un tempo finisse
          # oltre l'ultimo fotogramma, si vedrebbe qui e non in montaggio.
          ./scripts/click-gap.sh video/out/.fast-prompt-input.mp4
          ./scripts/beats.sh video/out/.fast-prompt-input.mp4
          ./scripts/contrast-floor.py video/out/.fast-prompt-input.mp4
          ./scripts/handoff-travel.sh video/out/.fast-card-handoff.mp4

      # Il banco nuovo va messo alla prova sul caso che deve bocciare, non solo
      # sul render che deve promuovere. Senza questo passo "verde" vorrebbe dire
      # soltanto che lo script e' arrivato in fondo.
      - name: il banco boccia il suo caso peggiore?
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          ./scripts/fixture-screenshot.sh
          if ./scripts/focus-sharpness.sh video/out/.fixture-card-focus-screenshot.mp4 >/dev/null 2>&1; then
            echo "focus-sharpness.sh promuove una scena fatta di screenshot: non misura niente." >&2
            exit 1
          fi
          echo "focus-sharpness.sh boccia la fixture, come deve."

          # rest-point.sh ha due modi di fallire e li deve distinguere: un
          # ritaglio preso dal mezzo di una scena si muove ai bordi (esce 1), un
          # fermo immagine non si muove da nessuna parte (esce 2). Se li
          # confondesse, o li promuovesse, non misurerebbe niente.
          #
          # `cmd; rc=$?` QUI NON FUNZIONA. Questo passo gira con `bash -e`: il
          # comando esce 1, che e' quello che vogliamo, e la shell se ne va prima
          # di assegnare rc. Il controllo non veniva nemmeno eseguito e il passo
          # falliva su un esito corretto. La forma `|| rc=$?` e' l'unica che
          # sopravvive a -e, ed e' il motivo per cui il controllo di
          # focus-sharpness qui sopra e' scritto come un `if`.
          ffmpeg -nostdin -v error -ss 2 -t 2 -i video/out/card-focus.mp4 -y /tmp/mosso.mp4
          rc=0; ./scripts/rest-point.sh /tmp/mosso.mp4 > /tmp/rp1.log 2>&1 || rc=$?
          [ "$rc" = 1 ] || { echo "rest-point.sh su un ritaglio mosso: atteso 1, ottenuto $rc" >&2; cat /tmp/rp1.log >&2; exit 1; }

          ffmpeg -nostdin -v error -i video/out/card-focus.mp4 -frames:v 1 -y /tmp/f.png
          ffmpeg -nostdin -v error -loop 1 -i /tmp/f.png -t 3 -r 30 -pix_fmt yuv420p -y /tmp/fermo.mp4
          rc=0; ./scripts/rest-point.sh /tmp/fermo.mp4 > /tmp/rp2.log 2>&1 || rc=$?
          [ "$rc" = 2 ] || { echo "rest-point.sh su un fermo immagine: atteso 2, ottenuto $rc" >&2; cat /tmp/rp2.log >&2; exit 1; }
          echo "rest-point.sh distingue una scena mossa da un fermo immagine."

          # click-gap.sh su una scena senza clic non deve trovare la coppia
          # colpo/conseguenza, e su un ritaglio in cui i fotogrammi fra i due
          # sono stati tolti deve accorgersi che si sono fusi.
          rc=0; ./scripts/click-gap.sh video/out/card-handoff.mp4 >/dev/null 2>&1 || rc=$?
          [ "$rc" = 1 ] || { echo "click-gap.sh su card-handoff: atteso 1, ottenuto $rc" >&2; exit 1; }

          ffmpeg -nostdin -v error -i video/out/prompt-input.mp4 \
            -vf "select='lt(n\,271)+gte(n\,276)',setpts=N/FRAME_RATE/TB" \
            -fps_mode passthrough -y /tmp/fuso.mp4
          rc=0; ./scripts/click-gap.sh /tmp/fuso.mp4 > /tmp/cg.log 2>&1 || rc=$?
          [ "$rc" = 1 ] || { echo "click-gap.sh sul ritaglio fuso: atteso 1, ottenuto $rc" >&2; cat /tmp/cg.log >&2; exit 1; }
          echo "click-gap.sh boccia sia una scena senza clic sia i due eventi fusi."

          # beats.sh senza OCR deve dire che non ha potuto misurare, e non
          # bocciare la scena. Senza questa distinzione ha passato mesi a
          # riportare "la risposta non si vede mai" su una macchina dove
          # tesseract non era installato: una diagnosi sulla scena per un
          # guasto dello strumento, lo stesso difetto di handoff-travel.sh.
          # Si toglie di mezzo il solo tesseract, non tutto il PATH: svuotando
          # il PATH sparirebbe anche bash e il verdetto sarebbe 127, cioe' un
          # altro guasto, e il controllo non proverebbe la distinzione voluta.
          TESS="$(command -v tesseract)"
          sudo mv "$TESS" "$TESS.off"
          rc=0; ./scripts/beats.sh >/dev/null 2>&1 || rc=$?
          sudo mv "$TESS.off" "$TESS"
          [ "$rc" = 3 ] || { echo "beats.sh senza tesseract: atteso 3 (non ho potuto misurare), ottenuto $rc" >&2; exit 1; }
          echo "beats.sh distingue una scena rotta da uno strumento assente."

          # contrast-floor.py deve bocciare la stessa scena attenuata troppo.
          # E' l'unica prova che il pavimento a 0,62 sia un limite e non una
          # decorazione: se anche 0,25 passasse, il banco non misurerebbe il
          # pavimento, misurerebbe che il testo esiste.
          ./scripts/fixture-attenuation.sh
          rc=0; ./scripts/contrast-floor.py video/out/.fixture-attn-025.mp4 >/dev/null 2>&1 || rc=$?
          [ "$rc" = 1 ] || { echo "contrast-floor.py sull'attenuazione a 0,25: atteso 1, ottenuto $rc" >&2; exit 1; }
          echo "contrast-floor.py boccia l'attenuazione a 0,25, come deve."

          # tempo.py deve bocciare una scena TAGLIATA invece che ritempificata:
          # e' esattamente quello che si otteneva abbassando la durata prima che
          # le battute la seguissero, ed e' il difetto che il banco cerca.
          ./scripts/fixture-trim.sh
          rc=0; ./scripts/tempo.py video/out/card-handoff.mp4 video/out/.fixture-trim.mp4 >/dev/null 2>&1 || rc=$?
          [ "$rc" = 1 ] || { echo "tempo.py sul ritaglio non ritempificato: atteso 1, ottenuto $rc" >&2; exit 1; }
          echo "tempo.py boccia una scena tagliata invece che ritempificata, come deve."


      # Da qui in poi i video sono buoni: o li ha appena fatti e misurati questa
      # run, o vengono da una che li aveva gia' misurati. Solo adesso si salvano.
      - name: salva i render verificati
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: video/out
          key: ${{ steps.key.outputs.value }}

      - name: assembla
        run: ./scripts/showcase-build.sh

      # La pagina del catalogo cambia a ogni push che tocca una demo, e non
      # passa dalla cache dei render: questo passo gira sempre. Misura le
      # dimostrazioni, non i video, ed e' l'unico controllo che vede le
      # differenze temporali - due eventi sullo stesso frame invece che a
      # cinque di distanza - che uno screenshot non puo' vedere.
      - name: le dimostrazioni mostrano ancora la loro tesi?
        run: |
          # pillow serve a loop-close.py per decodificare gli screenshot: e' l'unico
          # banco che guarda dei pixel del browser invece del DOM.
          python3 -m pip install --quiet --disable-pip-version-check playwright pillow
          python3 -m playwright install --with-deps chromium
          ./scripts/demo-check.py

          # E i cicli si devono chiudere. Le demo girano in loop: se l'ultimo
          # fotogramma non somiglia al primo, ogni giro ha uno stacco secco, e a
          # chi guarda non arriva "questa riparte", arriva "il sito scatta".
          # Dieci voci su trenta lo facevano, su una pagina che spiega perche'
          # gli stacchi non si fanno.
          ./scripts/loop-close.py

          # E il banco deve bocciare il suo caso peggiore: una copia della
          # pagina in cui CHR-03 fa scattare i tre eventi a frame distinti in
          # entrambe le meta', cioe' senza piu' il contrasto che la voce
          # dichiara. Se qui passasse, il verde qui sopra vorrebbe dire solo
          # che lo script e' arrivato in fondo.
          sed 's/var fn=second?30:35, fp=second?30:41;/var fn=35, fp=41;/' \
            showcase/dist/grammatica.html > /tmp/guasta.html
          if cmp -s showcase/dist/grammatica.html /tmp/guasta.html; then
            echo "la copia guasta e' identica all'originale: la sed non ha trovato niente." >&2
            exit 1
          fi
          rc=0; ./scripts/demo-check.py /tmp/guasta.html > /tmp/guasta.log 2>&1 || rc=$?
          if [ "$rc" = 0 ]; then
            echo "demo-check.py promuove una pagina in cui CHR-03 non dimostra piu' niente." >&2
            cat /tmp/guasta.log >&2; exit 1
          fi
          grep -q 'ROTTA CHR-03' /tmp/guasta.log || {
            echo "demo-check.py boccia la copia guasta ma non nomina CHR-03:" >&2
            cat /tmp/guasta.log >&2; exit 1; }
          echo "demo-check.py boccia la copia guasta e dice quale voce, come deve."

          # E lo stesso sul lato tipografico, che ha un palco diverso e quindi
          # una sonda diversa: qui si rendono uguali le due soste di TYP-01, cioe'
          # si toglie il contrasto sul quale la voce si regge.
          sed 's/dwell=second?41:62/dwell=62/' \
            showcase/dist/grammatica.html > /tmp/guasta-typ.html
          if cmp -s showcase/dist/grammatica.html /tmp/guasta-typ.html; then
            echo "la copia guasta tipografica e' identica all'originale: la sed non ha trovato niente." >&2
            exit 1
          fi
          rc=0; ./scripts/demo-check.py /tmp/guasta-typ.html > /tmp/gt.log 2>&1 || rc=$?
          [ "$rc" != 0 ] || { echo "demo-check.py promuove una pagina in cui le due soste di TYP-01 sono uguali." >&2; cat /tmp/gt.log >&2; exit 1; }
          grep -q 'ROTTA TYP-01' /tmp/gt.log || {
            echo "demo-check.py boccia la copia guasta tipografica ma non nomina TYP-01:" >&2
            cat /tmp/gt.log >&2; exit 1; }
          echo "demo-check.py boccia anche una voce tipografica senza contrasto."

          # loop-close.py deve bocciare un ciclo che non si chiude: si rimette
          # CAM-01 a senso unico, cioe' com'era prima di avere la gamba di
          # rientro, e il banco deve accorgersene e nominarla.
          sed 's/var t=trip(f,170,108,26), p=mix(START,END,t)/var t=E.inout(cl((f-6)\/108)), p=mix(START,END,t)/' \
            showcase/dist/grammatica.html > /tmp/guasta-loop.html
          if cmp -s showcase/dist/grammatica.html /tmp/guasta-loop.html; then
            echo "la copia guasta del ciclo e' identica all'originale: la sed non ha trovato niente." >&2
            exit 1
          fi
          rc=0; ./scripts/loop-close.py /tmp/guasta-loop.html > /tmp/gl.log 2>&1 || rc=$?
          [ "$rc" != 0 ] || { echo "loop-close.py promuove una demo a senso unico." >&2; cat /tmp/gl.log >&2; exit 1; }
          grep -q 'CAM-01' /tmp/gl.log || {
            echo "loop-close.py boccia la copia guasta ma non nomina CAM-01:" >&2
            cat /tmp/gl.log >&2; exit 1; }
          echo "loop-close.py boccia un ciclo che non si chiude, come deve."

          # E deve bocciare anche uno stacco IN MEZZO al ciclo: si rimette CHR-02
          # a ripartire dal vuoto nella seconda meta', cioe' com'era prima
          # dell'orologio virtuale. E' il difetto che si vedeva scorrendo il sito.
          sed 's/var second=f>=125, q=vtime(second?f-125:f,125,86,14);/var second=f>=125, q=second?f-125:f;/' \
            showcase/dist/grammatica.html > /tmp/guasta-mezzo.html
          if cmp -s showcase/dist/grammatica.html /tmp/guasta-mezzo.html; then
            echo "la copia guasta di mezzo e' identica all'originale: la sed non ha trovato niente." >&2
            exit 1
          fi
          rc=0; ./scripts/loop-close.py /tmp/guasta-mezzo.html > /tmp/gm.log 2>&1 || rc=$?
          [ "$rc" != 0 ] || { echo "loop-close.py promuove una meta' che riparte da capo." >&2; cat /tmp/gm.log >&2; exit 1; }
          grep -q 'CHR-02' /tmp/gm.log || {
            echo "loop-close.py boccia la copia guasta ma non nomina CHR-02:" >&2
            cat /tmp/gm.log >&2; exit 1; }
          echo "loop-close.py boccia anche uno stacco in mezzo al ciclo."

      # I render restano scaricabili dalla run anche quando il deploy non parte,
      # cosi' su una PR si guarda il video invece di fidarsi del diff.
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: showcase/dist/*.mp4
          retention-days: 7

      # Il deploy e' l'unico passo che ha bisogno di una credenziale, quindi e'
      # l'unico che puo' non essere disponibile. Senza il token il workflow
      # renderizza, misura e carica gli artefatti lo stesso: una CI che si
      # rifiuta di girare finche' non le dai un segreto e' una CI che nessuno
      # accende. Con il token, il deploy parte da solo.
      - name: c'e' il token?
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=deploy saltato::CLOUDFLARE_API_TOKEN non configurato. I render sono negli artefatti della run. Per attivare il deploy automatico: gh secret set CLOUDFLARE_API_TOKEN --repo armonia/scenes"
          fi

      - name: deploy
        if: |
          steps.cf.outputs.ok == 'true' &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Il progetto Pages si chiama ancora 'remotion-scenes': Cloudflare non
          # rinomina i progetti, e il record DNS di scenes.armonia.io punta al
          # suo hostname. Crearne uno nuovo col nome giusto e spostarci il
          # dominio ha mandato il sito in 522 per un quarto d'ora, perche' il
          # CNAME continuava a puntare al vecchio. Il nome interno non si vede
          # da fuori; il sito giu' si.
          command: pages deploy showcase/dist --project-name remotion-scenes --branch main
